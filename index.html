<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Modular Procedural Masterpiece - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Global Error Catcher for iPhone -->
    <script>
        window.addEventListener('error', function(event) {
            const d = document.createElement('div');
            d.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:99999;padding:20px;font-family:monospace;font-size:14px;word-break:break-all;box-sizing:border-box;';
            d.innerText = 'Error: ' + event.message + ' \nAt: ' + event.filename + ':' + event.lineno;
            document.body.appendChild(d);
        });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
